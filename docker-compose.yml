name: codr

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codr}
      POSTGRES_DB: ${POSTGRES_DB:-codr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Code execution engine. Every program runs inside an isolate sandbox with no
  # network, cgroup memory/CPU/process limits, a private filesystem and output
  # caps. isolate needs a privileged container to create those cgroups.
  runner:
    # Piston, pinned, with a larger request body limit (see runner/Dockerfile).
    build: ./runner
    image: codr-runner:latest
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_OUTPUT_MAX_SIZE: "4194304"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_FILE_SIZE: "16000000"
      PISTON_COMPILE_TIMEOUT: "20000"
      PISTON_COMPILE_CPU_TIME: "20000"
      PISTON_COMPILE_MEMORY_LIMIT: "2147483648"
      PISTON_RUN_TIMEOUT: "40000"
      PISTON_RUN_CPU_TIME: "20000"
      PISTON_RUN_MEMORY_LIMIT: "2147483648"
      PISTON_MAX_CONCURRENT_JOBS: "64"
      PISTON_BODY_LIMIT: "64mb"
    volumes:
      # Language packages (RUNNER_PACKAGES, installed by the web service on
      # first boot) are downloaded once and kept here.
      - runner-packages:/piston/packages
    tmpfs:
      - /tmp:exec

  web:
    build: .
    image: codr-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-codr}:${POSTGRES_PASSWORD:-codr}@db:5432/${POSTGRES_DB:-codr}
      RUNNER_URL: http://runner:2000
    ports:
      - "${CODR_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  runner-packages:
